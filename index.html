<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task & Email Reminder App</title>
  
  <!-- Google Fonts for Modern Typography -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Configure Tailwind for Dark Mode -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Poppins', 'sans-serif'] }
        }
      }
    }
  </script>

  <!-- Early Theme Script to prevent flash of incorrect theme -->
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>

  <style>
    /* Smooth transitions for theme switching */
    body { transition: background-color 0.3s ease, color 0.3s ease; }
    .glass-card {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
  </style>
</head>

<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-teal-50 dark:from-slate-900 dark:via-indigo-950 dark:to-slate-900 text-gray-800 dark:text-slate-100 min-h-screen font-sans bg-fixed">

  <!-- AUTHENTICATION VIEW -->
  <div id="auth-view" class="min-h-screen flex items-center justify-center p-4">
    <div class="glass-card bg-white/70 dark:bg-slate-800/70 border border-white/50 dark:border-slate-700/50 rounded-3xl shadow-2xl p-8 w-full max-w-md relative overflow-hidden">
      
      <!-- Decorative background blur elements inside the card -->
      <div class="absolute -top-10 -right-10 w-32 h-32 bg-indigo-500/20 rounded-full blur-2xl"></div>
      <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-teal-500/20 rounded-full blur-2xl"></div>

      <div class="relative z-10">
        <div class="flex justify-center mb-4">
          <div class="bg-gradient-to-br from-indigo-500 to-purple-600 p-3 rounded-2xl shadow-lg">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          </div>
        </div>
        <h1 id="auth-title" class="text-3xl font-bold text-center text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 dark:from-indigo-400 dark:to-purple-400 mb-2">Welcome</h1>
        <p id="auth-subtitle" class="text-gray-500 dark:text-slate-400 text-center text-sm mb-6">Log in to manage your schedule</p>

        <div id="auth-error" class="hidden bg-red-100 dark:bg-red-500/20 border border-red-400 dark:border-red-500 text-red-600 dark:text-red-300 text-sm p-3 rounded-xl mb-4"></div>

        <form id="auth-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1 ml-1">Email</label>
            <input type="email" id="email" required placeholder="you@example.com"
              class="w-full bg-white/50 dark:bg-slate-900/50 border border-gray-200 dark:border-slate-700 rounded-xl px-4 py-3 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all placeholder-gray-400" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1 ml-1">Password</label>
            <input type="password" id="password" required minlength="6" placeholder="••••••••"
              class="w-full bg-white/50 dark:bg-slate-900/50 border border-gray-200 dark:border-slate-700 rounded-xl px-4 py-3 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all placeholder-gray-400" />
          </div>
          <button type="submit" id="auth-submit-btn"
            class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold py-3 rounded-xl shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5 mt-2">
            Log In
          </button>
        </form>

        <p class="text-center text-sm text-gray-500 dark:text-slate-400 mt-6">
          <span id="auth-toggle-text">Don't have an account?</span>
          <button id="auth-toggle-btn" class="text-indigo-600 dark:text-indigo-400 hover:underline font-semibold ml-1">Register</button>
        </p>
      </div>
    </div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="app-view" class="hidden max-w-5xl mx-auto p-4 md:p-8">
    
    <!-- Header -->
    <header class="glass-card bg-white/70 dark:bg-slate-800/70 border border-white/50 dark:border-slate-700/50 rounded-2xl p-4 md:p-6 mb-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4 shadow-sm">
      <div class="flex items-center gap-4">
        <div class="bg-gradient-to-br from-indigo-500 to-purple-600 p-2.5 rounded-xl shadow-md hidden sm:block">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
        </div>
        <div>
          <h1 class="text-2xl font-bold text-gray-800 dark:text-white tracking-tight">Focus <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 dark:from-indigo-400 dark:to-purple-400">Hub</span></h1>
          <p class="text-sm text-gray-500 dark:text-slate-400">User: <span id="user-email-display" class="font-medium text-gray-700 dark:text-slate-200"></span></p>
        </div>
      </div>
      
      <div class="flex items-center gap-3">
        <!-- Theme Toggle Button -->
        <button id="theme-toggle" class="p-2.5 rounded-xl bg-gray-100 dark:bg-slate-700 text-gray-600 dark:text-slate-300 hover:bg-gray-200 dark:hover:bg-slate-600 transition-colors shadow-sm">
          <!-- Sun Icon -->
          <svg id="icon-sun" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
          <!-- Moon Icon -->
          <svg id="icon-moon" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
        <button id="logout-btn" class="bg-white dark:bg-slate-700 border border-gray-200 dark:border-slate-600 hover:bg-red-50 dark:hover:bg-red-500/20 hover:text-red-600 dark:hover:text-red-400 text-sm font-medium px-5 py-2.5 rounded-xl transition-all shadow-sm">
          Log Out
        </button>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="flex p-1 bg-white/50 dark:bg-slate-800/50 backdrop-blur-sm border border-gray-200 dark:border-slate-700 rounded-2xl mb-8 shadow-sm">
      <button id="tab-todo" class="flex-1 py-3 px-4 rounded-xl font-semibold text-sm transition-all shadow-sm bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-400">
        <span class="flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
          Quick To-Do
        </span>
      </button>
      <button id="tab-reminder" class="flex-1 py-3 px-4 rounded-xl font-semibold text-sm transition-all text-gray-500 dark:text-slate-400 hover:text-gray-700 dark:hover:text-slate-200 hover:bg-white/50 dark:hover:bg-slate-700/50">
        <span class="flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
          Email Reminders
        </span>
      </button>
    </div>

    <!-- TO-DO LIST SECTION -->
    <section id="section-todo" class="glass-card bg-white/70 dark:bg-slate-800/70 border border-white/50 dark:border-slate-700/50 rounded-3xl p-6 md:p-8 shadow-lg">
      <h2 class="text-xl font-bold mb-6 text-gray-800 dark:text-white">Daily Tasks</h2>
      <form id="todo-form" class="flex flex-col sm:flex-row gap-3 mb-8">
        <input type="text" id="todo-input" required placeholder="What do you need to get done?"
          class="flex-1 bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl px-5 py-3.5 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner" />
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-3.5 rounded-xl font-semibold shadow-md transition-all transform hover:-translate-y-0.5 whitespace-nowrap">
          Add Task
        </button>
      </form>
      <ul id="todo-list" class="space-y-3"></ul>
    </section>

    <!-- EMAIL REMINDER SECTION -->
    <section id="section-reminder" class="hidden glass-card bg-white/70 dark:bg-slate-800/70 border border-white/50 dark:border-slate-700/50 rounded-3xl p-6 md:p-8 shadow-lg">
      <div class="mb-6 border-b border-gray-200 dark:border-slate-700 pb-4">
        <h2 class="text-xl font-bold text-gray-800 dark:text-white">Schedule Alert</h2>
        <p class="text-sm text-gray-500 dark:text-slate-400 mt-1">Automated emails fire <strong>1 hour</strong> and <strong>30 minutes</strong> prior by default.</p>
      </div>

      <form id="reminder-form" class="bg-white/40 dark:bg-slate-900/40 p-5 md:p-6 rounded-2xl border border-gray-200/60 dark:border-slate-700/60 mb-8 shadow-sm">
        <div class="mb-4">
          <label class="block text-xs font-semibold text-gray-600 dark:text-slate-400 uppercase tracking-wider mb-2 ml-1">Task Title</label>
          <input type="text" id="reminder-title" required placeholder="e.g., Finalize Presentation"
            class="w-full bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl px-4 py-3 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-teal-500 shadow-inner" />
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 dark:text-slate-400 uppercase tracking-wider mb-2 ml-1">Date</label>
            <input type="date" id="reminder-date" required
              class="w-full bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl px-4 py-3 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-teal-500 shadow-inner [color-scheme:light] dark:[color-scheme:dark]" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 dark:text-slate-400 uppercase tracking-wider mb-2 ml-1">Time</label>
            <input type="time" id="reminder-time" required
              class="w-full bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl px-4 py-3 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-teal-500 shadow-inner [color-scheme:light] dark:[color-scheme:dark]" />
          </div>
        </div>

        <div class="mb-5">
          <label class="block text-xs font-semibold text-gray-600 dark:text-slate-400 uppercase tracking-wider mb-2 ml-1">Extra Alert (Optional)</label>
          <input type="number" id="reminder-custom-min" placeholder="Minutes before (e.g., 15)" min="1"
            class="w-full bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl px-4 py-3 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-teal-500 shadow-inner" />
        </div>

        <button type="submit" class="w-full bg-gradient-to-r from-teal-500 to-emerald-600 hover:from-teal-400 hover:to-emerald-500 text-white px-6 py-3.5 rounded-xl font-bold shadow-md transition-all transform hover:-translate-y-0.5 text-sm uppercase tracking-wider">
          Set Reminder
        </button>
      </form>

      <ul id="reminder-list" class="space-y-4"></ul>
    </section>
  </div>

  <!-- FIREBASE SCRIPTS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, where, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ============================================================================
    // PASTE YOUR FIREBASE CONFIG OBJECT BELOW
    // ============================================================================
    const firebaseConfig = {
  apiKey: "AIzaSyAkGBv2uvjzrFhFwuDHxuuv7s56xTnWtBc",
  authDomain: "todo-reminder-app-fd196.firebaseapp.com",
  projectId: "todo-reminder-app-fd196",
  storageBucket: "todo-reminder-app-fd196.firebasestorage.app",
  messagingSenderId: "66111126722",
  appId: "1:66111126722:web:f8f2782bab8c7b2e4ecf5b"
};


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Dark Mode Toggle Logic
    const themeToggleBtn = document.getElementById('theme-toggle');
    themeToggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    });

    // UI Elements
    const authView = document.getElementById("auth-view"), appView = document.getElementById("app-view"), authForm = document.getElementById("auth-form");
    const authTitle = document.getElementById("auth-title"), authSubtitle = document.getElementById("auth-subtitle"), authSubmitBtn = document.getElementById("auth-submit-btn");
    const authToggleBtn = document.getElementById("auth-toggle-btn"), authToggleText = document.getElementById("auth-toggle-text"), authError = document.getElementById("auth-error");
    const userEmailDisplay = document.getElementById("user-email-display"), logoutBtn = document.getElementById("logout-btn");

    const tabTodo = document.getElementById("tab-todo"), tabReminder = document.getElementById("tab-reminder");
    const sectionTodo = document.getElementById("section-todo"), sectionReminder = document.getElementById("section-reminder");

    const todoForm = document.getElementById("todo-form"), todoInput = document.getElementById("todo-input"), todoList = document.getElementById("todo-list");

    const reminderForm = document.getElementById("reminder-form"), reminderTitle = document.getElementById("reminder-title");
    const reminderDate = document.getElementById("reminder-date"), reminderTime = document.getElementById("reminder-time");
    const reminderCustomMin = document.getElementById("reminder-custom-min"), reminderList = document.getElementById("reminder-list");

    let isRegisterMode = false, currentUser = null, unsubscribeTasks = null;

    authToggleBtn.addEventListener("click", () => {
      isRegisterMode = !isRegisterMode;
      authError.classList.add("hidden");
      authTitle.textContent = isRegisterMode ? "Create Account" : "Welcome";
      authSubtitle.textContent = isRegisterMode ? "Sign up to start organizing your schedule" : "Log in to manage your schedule";
      authSubmitBtn.textContent = isRegisterMode ? "Register" : "Log In";
      authToggleText.textContent = isRegisterMode ? "Already have an account?" : "Don't have an account?";
      authToggleBtn.textContent = isRegisterMode ? "Log in" : "Register";
    });

    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      authError.classList.add("hidden");
      const email = document.getElementById("email").value.trim(), password = document.getElementById("password").value;
      try {
        if (isRegisterMode) await createUserWithEmailAndPassword(auth, email, password);
        else await signInWithEmailAndPassword(auth, email, password);
        authForm.reset();
      } catch (err) {
        authError.textContent = err.message.replace("Firebase: ", "");
        authError.classList.remove("hidden");
      }
    });

    logoutBtn.addEventListener("click", () => signOut(auth));

    // Tab Styling Switcher
    const activeTabClasses = "flex-1 py-3 px-4 rounded-xl font-semibold text-sm transition-all shadow-sm bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-400";
    const inactiveTabClasses = "flex-1 py-3 px-4 rounded-xl font-semibold text-sm transition-all text-gray-500 dark:text-slate-400 hover:text-gray-700 dark:hover:text-slate-200 hover:bg-white/50 dark:hover:bg-slate-700/50";

    tabTodo.addEventListener("click", () => {
      sectionTodo.classList.remove("hidden"); sectionReminder.classList.add("hidden");
      tabTodo.className = activeTabClasses; tabReminder.className = inactiveTabClasses;
    });

    tabReminder.addEventListener("click", () => {
      sectionReminder.classList.remove("hidden"); sectionTodo.classList.add("hidden");
      tabReminder.className = activeTabClasses.replace('indigo', 'teal'); tabTodo.className = inactiveTabClasses;
    });

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        authView.classList.add("hidden"); appView.classList.remove("hidden");
        userEmailDisplay.textContent = user.email;
        listenToUserTasks(user.uid);
      } else {
        authView.classList.remove("hidden"); appView.classList.add("hidden");
        if (unsubscribeTasks) unsubscribeTasks();
      }
    });

    todoForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentUser || !todoInput.value.trim()) return;
      const title = todoInput.value.trim();
      todoInput.value = "";
      await addDoc(collection(db, "tasks"), {
        userId: currentUser.uid, userEmail: currentUser.email, title: title, type: "todo",
        dueDate: null, isCompleted: false, reminder60Sent: false, reminder30Sent: false,
        customReminderMinutes: null, customReminderSent: false, createdAt: new Date().toISOString()
      });
    });

    reminderForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentUser || !reminderTitle.value.trim() || !reminderDate.value || !reminderTime.value) return;
      
      const title = reminderTitle.value.trim();
      const localDateTime = new Date(`${reminderDate.value}T${reminderTime.value}`);
      const dueDateUTC = localDateTime.toISOString();
      const customMinVal = reminderCustomMin.value ? parseInt(reminderCustomMin.value) : null;

      reminderTitle.value = ""; reminderDate.value = ""; reminderTime.value = ""; reminderCustomMin.value = "";

      await addDoc(collection(db, "tasks"), {
        userId: currentUser.uid, userEmail: currentUser.email, title: title, type: "reminder",
        dueDate: dueDateUTC, isCompleted: false, reminder60Sent: false, reminder30Sent: false,
        customReminderMinutes: customMinVal, customReminderSent: false, createdAt: new Date().toISOString()
      });
    });

    function listenToUserTasks(uid) {
      if (unsubscribeTasks) unsubscribeTasks();
      unsubscribeTasks = onSnapshot(query(collection(db, "tasks"), where("userId", "==", uid)), (snapshot) => {
        todoList.innerHTML = ""; reminderList.innerHTML = "";
        const docs = [];
        snapshot.forEach((docSnap) => docs.push({ id: docSnap.id, ...docSnap.data() }));
        docs.sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));

        docs.forEach((task) => {
          if (task.type === "reminder" || task.dueDate) renderReminderItem(task);
          else renderTodoItem(task);
        });
      });
    }

    function renderTodoItem(task) {
      const li = document.createElement("li");
      li.className = "group flex items-center justify-between bg-white dark:bg-slate-900 border border-gray-100 dark:border-slate-700/80 px-5 py-4 rounded-2xl shadow-sm hover:shadow-md transition-all";
      li.innerHTML = `
        <label class="flex items-center gap-4 cursor-pointer flex-1">
          <div class="relative flex items-center justify-center">
            <input type="checkbox" ${task.isCompleted ? "checked" : ""} class="peer appearance-none w-6 h-6 border-2 border-gray-300 dark:border-slate-600 rounded-full checked:bg-indigo-500 checked:border-indigo-500 transition-colors cursor-pointer" />
            <svg class="absolute w-4 h-4 text-white opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
          </div>
          <span class="text-base font-medium transition-colors ${task.isCompleted ? "line-through text-gray-400 dark:text-slate-500" : "text-gray-700 dark:text-slate-200"}">${escapeHtml(task.title)}</span>
        </label>
        <button class="text-gray-400 hover:text-red-500 dark:text-slate-500 dark:hover:text-red-400 p-2 rounded-xl hover:bg-red-50 dark:hover:bg-red-500/10 transition-colors opacity-0 group-hover:opacity-100 focus:opacity-100">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </button>`;
      li.querySelector("input").addEventListener("change", (e) => updateDoc(doc(db, "tasks", task.id), { isCompleted: e.target.checked }));
      li.querySelector("button").addEventListener("click", () => deleteDoc(doc(db, "tasks", task.id)));
      todoList.appendChild(li);
    }

    function renderReminderItem(task) {
      const li = document.createElement("li");
      li.className = "group flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white dark:bg-slate-900 border border-gray-100 dark:border-slate-700/80 px-5 py-4 rounded-2xl shadow-sm hover:shadow-md transition-all";
      
      const formattedDate = task.dueDate ? new Date(task.dueDate).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : "No date";
      
      const bStyle = "text-xs px-2.5 py-1 rounded-md font-medium border";
      const b60 = task.reminder60Sent ? `<span class="${bStyle} bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-200 dark:border-emerald-500/30 flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg> 1h</span>` : `<span class="${bStyle} bg-gray-50 dark:bg-slate-800 text-gray-500 dark:text-slate-400 border-gray-200 dark:border-slate-700">1h</span>`;
      const b30 = task.reminder30Sent ? `<span class="${bStyle} bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-200 dark:border-emerald-500/30 flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg> 30m</span>` : `<span class="${bStyle} bg-gray-50 dark:bg-slate-800 text-gray-500 dark:text-slate-400 border-gray-200 dark:border-slate-700">30m</span>`;
      
      let customBadge = "";
      if (task.customReminderMinutes) {
        customBadge = task.customReminderSent 
          ? `<span class="${bStyle} bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 border-indigo-200 dark:border-indigo-500/30 flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg> ${task.customReminderMinutes}m</span>` 
          : `<span class="${bStyle} bg-gray-50 dark:bg-slate-800 text-gray-500 dark:text-slate-400 border-gray-200 dark:border-slate-700">${task.customReminderMinutes}m</span>`;
      }

      li.innerHTML = `
        <div class="flex items-start gap-4 flex-1">
          <div class="relative flex items-center justify-center mt-0.5">
            <input type="checkbox" ${task.isCompleted ? "checked" : ""} class="peer appearance-none w-6 h-6 border-2 border-gray-300 dark:border-slate-600 rounded-full checked:bg-teal-500 checked:border-teal-500 transition-colors cursor-pointer" />
            <svg class="absolute w-4 h-4 text-white opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
          </div>
          <div>
            <p class="text-base font-medium ${task.isCompleted ? "line-through text-gray-400 dark:text-slate-500" : "text-gray-800 dark:text-slate-100"}">${escapeHtml(task.title)}</p>
            <div class="flex items-center gap-1.5 text-xs text-gray-500 dark:text-slate-400 mt-1 font-medium">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              ${formattedDate}
            </div>
            <div class="flex flex-wrap gap-2 mt-3">${b60} ${b30} ${customBadge}</div>
          </div>
        </div>
        <button class="text-gray-400 hover:text-red-500 dark:text-slate-500 dark:hover:text-red-400 p-2 rounded-xl hover:bg-red-50 dark:hover:bg-red-500/10 transition-colors self-end sm:self-center opacity-0 group-hover:opacity-100 focus:opacity-100">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </button>`;
        
      li.querySelector("input").addEventListener("change", (e) => updateDoc(doc(db, "tasks", task.id), { isCompleted: e.target.checked }));
      li.querySelector("button").addEventListener("click", () => deleteDoc(doc(db, "tasks", task.id)));
      reminderList.appendChild(li);
    }

    function escapeHtml(str) { return str.replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m])); }
  </script>
</body>
</html>
